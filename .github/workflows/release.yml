# Build JS80P on Windows, Linux and macOS with CMake, and attach the packaged
# artifacts to the GitHub Release that triggered the run.
#
# The VST3 is JS80P's original hand-rolled implementation with the JUCE GUI on
# top, so it keeps the original's class IDs, parameters and state format; the
# Standalone that also builds is a GUI development aid and is not packaged. See
# CMakeLists.txt.
#
# The build mirrors BUILD.md / CMakeLists.txt:
#   * JUCE 8.0.14 is fetched by CMake on first configure (FetchContent).
#   * Linux / macOS build with Ninja + the system/Apple compiler.
#   * Windows builds with the Visual Studio generator's ClangCL toolset
#     (clang-cl) — MSVC cl.exe and MinGW are rejected by CMakeLists.txt.
name: Build / Release

on:
  # Build + upload assets when a GitHub Release is created.
  release:
    types:
      - created
      - edited
  # Allow manual runs to smoke-test the build; these upload the zips as
  # workflow artifacts only (no release to attach to).
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          # windows-2025 / windows-latest migrated to Visual Studio 2026 in
          # June 2026; pin to windows-2022 for the VS 2022 + ClangCL toolset
          # the "Visual Studio 17 2022" generator below needs.
          - os: windows-2022
            name: windows
          - os: macos-15
            name: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Toolchain / dependencies ──────────────────────────────
      # CMake and Ninja are pre-installed on all GitHub-hosted runners, so we
      # only need the Linux system libraries JUCE actually links against:
      #   * libasound2-dev            — ALSA, for the Standalone's audio I/O
      #   * libfreetype-dev/fontconfig — juce_graphics text rendering
      #   * libx*-dev                 — juce_gui_basics (X11)
      # JUCE's optional deps are intentionally omitted: JACK (JUCE_JACK off by
      # default), curl (JUCE_USE_CURL=0), webkit (JUCE_WEB_BROWSER=0) and
      # OpenGL/mesa (juce_opengl is not used).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      # ── Version ───────────────────────────────────────────────
      # scripts/release.sh takes the version from the git tag on HEAD and
      # derives the rest; do the same from the release tag, so the dist path
      # names the version actually being released rather than whatever
      # project() in CMakeLists.txt happens to say. Untagged runs
      # (workflow_dispatch / push) get release.sh's development version, which
      # is why 999.0.0 and the short SHA appear here.
      - name: Version
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"

          if [[ "$tag" =~ ^v[0-9][-.0-9a-zA-Z]+$ ]]; then
            dot="${tag:1}"
            str="$dot"
          else
            dot="999.0.0"
            str="$dot-$(git log -1 --pretty=%h)"
          fi

          # version_str_to_int / version_str_to_file_name, release.sh:389-398.
          int="$(printf '%s0\n' "$dot" | sed 's/[^0-9]//g')"
          file="$(printf '%s\n' "$str" | sed 's/[^0-9a-f-]/_/g')"

          {
            echo "JS80P_VERSION_STR=$str"
            echo "JS80P_VERSION_INT=$int"
            echo "JS80P_VERSION_AS_FILE_NAME=$file"
          } >> "$GITHUB_ENV"

          echo "Building version: $str (int $int, path token $file)"

      # ── Configure ─────────────────────────────────────────────
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DJS80P_VERSION_STR=$JS80P_VERSION_STR"
          "-DJS80P_VERSION_INT=$JS80P_VERSION_INT"
          "-DJS80P_VERSION_AS_FILE_NAME=$JS80P_VERSION_AS_FILE_NAME"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        # One universal binary covering Apple Silicon and Intel, as the original
        # ships. release.sh gets there by building arm64 and x86_64 separately
        # and lipo-ing them; CMAKE_OSX_ARCHITECTURES makes the fat Mach-O in a
        # single pass, and CMakeLists.txt puts AVX on the x86_64 slice alone
        # (-Xarch_x86_64), which is what the original's per-arch -mavx did.
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          "-DJS80P_VERSION_STR=$JS80P_VERSION_STR"
          "-DJS80P_VERSION_INT=$JS80P_VERSION_INT"
          "-DJS80P_VERSION_AS_FILE_NAME=$JS80P_VERSION_AS_FILE_NAME"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        # The windows runner ships VS 2022 with the "C++ Clang tools" component,
        # so the ClangCL toolset gives us clang-cl (the only supported Windows
        # compiler) via the Visual Studio generator.
        shell: bash
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL
          "-DJS80P_VERSION_STR=$JS80P_VERSION_STR"
          "-DJS80P_VERSION_INT=$JS80P_VERSION_INT"
          "-DJS80P_VERSION_AS_FILE_NAME=$JS80P_VERSION_AS_FILE_NAME"

      # ── Build ─────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release --parallel

      # ── Package ───────────────────────────────────────────────
      # Zip the VST3 build into archives per platform.
      # 7-Zip is pre-installed on every GitHub-hosted runner and, unlike
      # `cmake -E tar --format=zip` (libarchive's low default deflate level),
      # lets us max out compression while still emitting a standard .zip:
      #   -mx=9      maximum compression
      #   -mfb=258   largest deflate match length
      #   -mpass=15  most deflate passes
      - name: Package
        shell: bash
        run: |
          # The build emits the original plugin's own dist layout, so the
          # artefact is a lower-case js80p.vst3 under one of
          #   build/dist/js80p-<v>-linux-x86_64-avx-vst3_single/
          #   build/dist/js80p-<v>-windows-x86_64-avx-vst3_single/
          #   build/dist/js80p-<v>-macos-universal-vst3_bundle/
          # (see JS80P_DIST_DIR in CMakeLists.txt) -- a bare shared library on
          # Linux/Windows, a bundle directory on macOS. Glob for either rather
          # than spelling the tokens out here, and name the zip after the
          # directory, as scripts/release.sh's finalize_zip does.
          dir=(build/dist/js80p-*-vst3_single build/dist/js80p-*-vst3_bundle)
          # Unmatched globs stay literal, so drop the pattern that missed.
          for i in "${!dir[@]}"; do
            [ -d "${dir[$i]}" ] || unset 'dir[$i]'
          done
          dir=("${dir[@]}")

          if [ ${#dir[@]} -ne 1 ] || [ ! -e "${dir[0]}/js80p.vst3" ]; then
            echo "expected exactly one built VST3, found: ${dir[*]}" >&2
            exit 1
          fi

          name="$(basename "${dir[0]}")"
          pushd "${dir[0]}"
          zip="$GITHUB_WORKSPACE/${name}.zip"
          7z a -tzip -mx=9 -mfb=258 -mpass=15 "$zip" js80p.vst3
          echo "ASSET=$zip" >> "$GITHUB_ENV"

      # ── Publish ───────────────────────────────────────────────
      # Always keep the zips as downloadable workflow artifacts...
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JS80P-${{ matrix.name }}
          path: ${{ env.ASSET }}

      # ...and, when triggered by a release, attach them to that release.
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
